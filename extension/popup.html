<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AllenPlan</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" type="module"></script>
  </head>
  <body class="popup-window">
    <header class="brand">
      <h1>AllenPlan<span aria-hidden="true">.</span></h1>
      <a id="open-help" href="help.html" target="_blank" rel="noopener" hidden>Help</a>
    </header>
    <main class="popup">
      <fieldset id="popup-actions" aria-label="Audit actions" hidden>
        <button id="import-dars" class="primary" type="button" aria-describedby="audit-major" hidden disabled>Import DARS</button>
        <p id="audit-major" class="audit-note" role="status" hidden></p>
        <button id="open-planner" type="button" aria-describedby="saved-audit" hidden>Open planner</button>
        <p id="saved-audit" class="audit-note" hidden></p>
        <button id="open-dars" type="button" hidden>Open DARS</button>
        <button id="delete-imported-data" class="delete-action" type="button" hidden>Delete imported audit</button>
      </fieldset>
      <p id="popup-status" role="status"></p>
    </main>
  </body>
</html>
